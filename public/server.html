<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server profile · unzi</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="/"><i class="brand-mark"></i><span>unzi</span></a><div class="top-actions"><a class="btn ghost" href="/dashboard.html">Dashboard</a><a class="btn primary" href="/auth/login">Đăng nhập Discord</a></div></header><div id="app"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=p=>fetch('/api'+p).then(async r=>{if(!r.ok)throw Object.assign(new Error(r.status),{status:r.status});return r.json()});const num=(v,d=0)=>v==null?'—':Number(v).toFixed(d);const id=new URLSearchParams(location.search).get('id');
async function load(){const root=document.getElementById('app');if(!id){root.innerHTML='<div class="card notice">Thiếu mã server.</div>';return}try{let d;try{d=await api('/guilds/'+encodeURIComponent(id))}catch(e){if(e.status!==404)throw e;d=await api('/my/guilds/'+encodeURIComponent(id))}const g=d.guild,s=d.score;root.innerHTML=`<section class="hero" style="padding-bottom:42px"><span class="eyebrow">Public server profile</span><h1>${esc(g.name)}</h1><p>${esc(g.description||'Hồ sơ cộng đồng trên unzi.')}</p><div class="hero-actions">${d.ranking?'<span class="status ok">Đang tham gia xếp hạng</span>':'<span class="status">Chưa tham gia xếp hạng</span>'}</div></section>${d.ranking&&s?`<div class="grid kpis"><div class="card"><span class="kpi-label">Overall</span><strong class="kpi-value" style="color:var(--brand)">${num(s.overall)}</strong><span class="muted">điểm tổng hợp</span></div><div class="card"><span class="kpi-label">Activity</span><strong class="kpi-value" style="color:var(--orange)">${num(s.activity)}</strong><span class="muted">nhịp hoạt động</span></div><div class="card"><span class="kpi-label">Welcoming</span><strong class="kpi-value" style="color:var(--cyan)">${num(s.welcoming)}</strong><span class="muted">đón người mới</span></div></div><div class="grid two"><div class="card"><h2>Về điểm số</h2><p class="muted">Confidence: ${num(s.confidence)}% · Trạng thái: ${esc(s.status||'Đang tích lũy')}</p><p class="muted">Điểm được tính từ dữ liệu hoạt động 30 ngày và chỉ hiển thị công khai khi đủ điều kiện.</p></div><div class="card"><h2>Minh bạch dữ liệu</h2><p class="muted">unzi không đọc nội dung tin nhắn. Dữ liệu người dùng được ẩn danh theo từng server.</p></div></div>`:'<div class="card notice"><h2>Server chưa tham gia xếp hạng</h2><p>Profile sẽ hiển thị các chỉ số sau khi bot unzi được thêm vào server.</p></div>'}`}catch(e){root.innerHTML=e.status===401?'<div class="card"><h1>Đăng nhập để xem server này</h1><a class="btn primary" href="/auth/login">Đăng nhập Discord</a></div>':'<div class="card notice">Không tìm thấy profile server.</div>'}}load();
</script></body></html>
