<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#172139;--line:#253250;--text:#f5f7fb;--muted:#91a0bc;--purple:#8b7bff;--cyan:#51d5d0;--orange:#ffb86b;--red:#ff758f;--green:#57d69b;--shadow:0 18px 50px #03071366}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#2d225d 0,transparent 34%),var(--bg);color:var(--text);font:500 14px/1.6 'Be Vietnam Pro',system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:242px;padding:26px 16px;border-right:1px solid var(--line);background:#0d1426cc;backdrop-filter:blur(18px);position:fixed;inset:0 auto 0 0;z-index:3}.brand{display:flex;gap:11px;align-items:center;font-size:17px;font-weight:800;margin:0 12px 42px}.brand i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 0 25px #8b7bff88}.nav-title{color:#60708f;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:24px 12px 8px}.nav a{display:flex;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);transition:.2s}.nav a:hover,.nav a.active{background:#ffffff0b;color:var(--text)}.nav a.active{box-shadow:inset 3px 0 var(--purple)}.side-foot{position:absolute;bottom:22px;left:28px;right:28px;color:var(--muted);font-size:12px}.main{margin-left:242px;width:calc(100% - 242px);padding:26px clamp(22px,5vw,70px) 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:10px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);transition:.2s}.btn:hover{transform:translateY(-2px);border-color:#6573a1}.btn.primary{background:linear-gradient(110deg,var(--purple),#6c63e9);border-color:transparent;box-shadow:0 8px 22px #7067e344}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}h1{font-size:clamp(28px,4vw,48px);line-height:1.15;margin:0 0 10px;letter-spacing:-.04em}h2{font-size:18px;margin:34px 0 14px}h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 7px}.muted{color:var(--muted)}.eyebrow{color:var(--cyan);font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:700}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(3,1fr);margin:28px 0}.card{background:linear-gradient(145deg,#17223a,#11192b);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);transition:.25s}.card:hover{transform:translateY(-3px);border-color:#45547b}.kpi .value{font-size:34px;font-weight:800;letter-spacing:-.04em}.kpi .trend{font-size:12px;color:var(--green);margin-left:8px}.split{grid-template-columns:1.25fr .75fr}.split2{grid-template-columns:1fr 1fr}.section-head{display:flex;justify-content:space-between;gap:14px;align-items:end}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.field{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px}.server-list{display:grid;gap:10px}.server{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);background:#121b30aa;border-radius:13px;transition:.2s}.server:hover{transform:translateX(4px);border-color:#5c66a0}.server-main{min-width:0;flex:1}.server-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.server-meta{font-size:12px;color:var(--muted)}.server-score{text-align:right;min-width:80px}.server-score strong{font-size:20px}.avatar{width:42px;height:42px;border-radius:13px;object-fit:cover;background:#263451}.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:#ffffff0a;padding:4px 9px;font-size:11px;color:var(--muted)}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--orange)}.status.ok{color:var(--green)}.status.ok:before{background:var(--green)}.status.off:before{background:var(--red)}.hero{display:flex;justify-content:space-between;align-items:start;gap:20px}.profile-title{display:flex;gap:15px;align-items:center}.profile-title .avatar{width:62px;height:62px}.profile-title h1{font-size:32px}.chart{width:100%;height:230px;display:block}.chart polyline{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .area{stroke:none;opacity:.16}.chart text{fill:var(--muted);font:10px 'Be Vietnam Pro'}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.bars{height:220px;display:flex;align-items:end;gap:6px;padding:15px 0 25px}.bar{flex:1;min-width:4px;background:linear-gradient(180deg,var(--purple),#5549b8);border-radius:5px 5px 2px 2px;min-height:3px;position:relative;transition:.25s}.bar:hover{background:var(--cyan)}.bar span{display:none;position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:10px;background:#050914;padding:3px 5px;border-radius:4px}.bar:hover span{display:block}.radar{width:100%;height:300px}.metric-row{margin:13px 0}.metric-row>div:first-child{display:flex;justify-content:space-between;font-size:12px}.meter{height:7px;border-radius:10px;background:#253250;margin-top:6px;overflow:hidden}.meter i{height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--purple),var(--cyan))}.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:var(--cyan);opacity:.2}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.switch{width:42px;height:24px;background:#293552;border-radius:99px;padding:3px;transition:.2s}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#7d8ba7;transition:.2s}.switch.on{background:var(--purple)}.switch.on i{background:#fff;transform:translateX(18px)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-weight:500}.notice{padding:13px 15px;background:#ffb86b12;border:1px solid #ffb86b44;color:#ffc989;border-radius:11px}.fade{animation:fade .45s ease both}.rise{animation:rise .55s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:850px){.side{width:68px;padding:22px 10px}.brand{margin:0 9px 42px}.brand span,.nav a span,.nav-title,.side-foot{display:none}.nav a{justify-content:center}.main{margin-left:68px;width:calc(100% - 68px);padding:22px}.kpis,.split,.split2{grid-template-columns:1fr}.top{margin-bottom:26px}.hero{display:block}.profile-title{margin-bottom:18px}}@media(max-width:520px){.main{padding:18px 14px}.top-actions .btn:not(.primary){display:none}.server-score{min-width:55px}.server{padding:12px}.kpis{gap:10px}.card{padding:15px}}
</style>
<style>
:root{--bg:#070b16;--panel:#0f1729;--panel2:#141f35;--line:#243452;--text:#f7f9ff;--muted:#91a0bb;--purple:#8e7dff;--cyan:#5be0d5;--orange:#ffc27b;--green:#62e0a4;--shadow:0 24px 70px #02051080}
body{background:linear-gradient(180deg,#0b1020 0,#070b16 48%,#0a0f1d 100%);letter-spacing:-.01em}
body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#304060 1px,transparent 1px),linear-gradient(90deg,#304060 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
.side{background:#09101ee8;border-color:#1d2b47}.brand{font-size:18px;letter-spacing:-.04em}.brand i{border-radius:9px;box-shadow:0 0 30px #8e7dff80}.side-foot{line-height:1.7}.side-foot span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#5e6f8c}
.main{max-width:1480px}.top{min-height:44px;margin-bottom:50px;border-bottom:1px solid #1b2942;padding-bottom:18px}.crumb{text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.14em;color:#61718f}.top-actions .btn{min-height:40px}.btn{font-weight:700;border-radius:9px;box-shadow:none}.btn.primary{background:linear-gradient(135deg,#9a8cff,#6d61e9);box-shadow:0 12px 26px #7569ed35}.btn.primary:hover{box-shadow:0 16px 30px #7569ed55}.btn.ghost{color:#c6d0e4}.btn.ghost:hover{background:#ffffff08}
h1{font-weight:800;letter-spacing:-.055em}h2{font-weight:750;letter-spacing:-.03em}.eyebrow{font-size:10px;letter-spacing:.18em}.section-head{align-items:flex-start}.section-head>div:first-child{max-width:720px}.section-head p{max-width:620px;font-size:15px;line-height:1.8}.card{background:linear-gradient(145deg,#14213aeb,#0e1729eb);border-color:#243656;box-shadow:var(--shadow)}.card:hover{border-color:#4b5e8a;box-shadow:0 28px 80px #02051099}.kpi .value{font-size:38px}.server{background:#101a2dca;border-color:#213352}.server:hover{transform:translateY(-3px);box-shadow:0 12px 30px #02051070}.server-meta{color:#8190ab}.status{border:1px solid #2a3a5a;background:#17233a;color:#aab8cf;font-weight:700}.status.ok{background:#153126;border-color:#286348;color:#7ce6b2}.field{background:#0d1628;border-color:#2a3d61;min-height:40px}.toolbar{margin:24px 0}.empty{background:#0d1628aa;border-color:#2a3b5d}.notice{background:#ffc27b0d;border-color:#ffc27b35}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.1em}.table td{padding-top:15px;padding-bottom:15px}.hero{padding-bottom:10px}.profile-title h1{font-size:36px}
.landing-note{display:flex;gap:12px;align-items:flex-start;margin:34px 0 10px;padding:14px 16px;border:1px solid #2b3d60;border-radius:12px;background:#101b30aa;color:#a9b7ce}.landing-note b{color:var(--text)}.landing-note i{width:8px;height:8px;flex:none;margin-top:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
@media(max-width:850px){.top{margin-bottom:30px}.top-actions .btn{padding:9px 11px}.section-head{display:block}.section-head>.btn{margin-top:16px}}

<body><div class="app"><aside class="side"><a class="brand" href="#/"><i></i><span>unzi</span></a><nav class="nav"><div class="nav-title">Workspace</div><a href="#/" data-route="home">◉ <span>Tổng quan</span></a><a href="#/dashboard" data-route="dashboard">▣ <span>Server của tôi</span></a><div class="nav-title">Khám phá</div><a href="#/" data-route="rank">✦ <span>Xếp hạng</span></a><a href="#/methodology" data-route="methodology">◌ <span>Cách tính</span></a><div class="nav-title admin-nav">Hệ thống</div><a href="#/admin" data-route="admin" class="admin-nav">⚙ <span>Admin panel</span></a></nav><div class="side-foot">unzi<br><span>public ranking · privacy first</span></div></aside><main class="main"><div class="top"><div class="crumb" id="crumb">Public ranking / Overview</div><div class="top-actions"><a class="btn ghost" href="/auth/login" id="login">Đăng nhập Discord</a><a class="btn primary" id="addBot" href="/auth/login">+ Thêm bot</a></div></div><div id="v"></div></main></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,o)=>fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{if(!r.ok)throw Object.assign(new Error(r.status),{status:r.status});return r.json()});
let currentSession=null;
async function updateSession(){try{const d=await api('/session');currentSession=d.authenticated?d.user:null;const login=document.getElementById('login'),add=document.getElementById('addBot'),hero=document.getElementById('heroCta');if(currentSession){login.href='/auth/logout';login.textContent=`${currentSession.name} · Đăng xuất`;add.href='#/dashboard';add.textContent='+ Quản lý server';if(hero){hero.href='#/dashboard';hero.textContent='+ Quản lý server'}}else{login.href='/auth/login';login.textContent='Đăng nhập Discord';add.href='/auth/login';add.textContent='+ Thêm bot';if(hero){hero.href='/auth/login';hero.textContent='+ Thêm bot để tham gia'}}}catch{currentSession=null}}
const num=(v,d=1)=>v==null?'—':Number(v).toFixed(d), CATS={gaming:'Gaming',education:'Học tập',technology:'Công nghệ',creator:'Sáng tạo',social:'Giao lưu',support:'Hỗ trợ',fan:'Fan',marketplace:'Giao dịch',other:'Khác'};
const ST={collecting:'Đang thu thập',provisional:'Tạm thời',ranked:'Đã xếp hạng',limited:'Dữ liệu hạn chế',review:'Đang kiểm tra'};
const LA={U:'Người tham gia',F:'Tần suất trò chuyện',Q:'Chất lượng tương tác',C:'Độ đều đặn',D:'Đa dạng tương tác',T:'Phân bố giờ và kênh'};
const LW={R:'Người mới được phản hồi',F:'Tốc độ phản hồi đầu tiên',C:'Trao đổi hai chiều',D7:'Còn hoạt động sau 7 ngày',D:'Người đón tiếp khác nhau',V:'Độ phủ dữ liệu'};
const view=h=>{document.getElementById('v').innerHTML=`<div class="fade">${h}</div>`;scrollTo(0,0);setActive();updateSession()};
const icon=g=>g?.icon?`<img class="avatar" alt="" src="https://cdn.discordapp.com/icons/${esc(g.id)}/${esc(g.icon)}.png?size=128">`:`<span class="avatar"></span>`;
const tags=c=>(c||[]).map(x=>CATS[x]||x).join(' · ');
const status=(s,ok=false)=>`<span class="status ${ok?'ok':''}">${esc(s)}</span>`;
const meter=(v,color='')=>`<div class="meter"><i style="width:${Math.max(0,Math.min(100,v||0))}%;${color?`background:${color}`:''}"></i></div>`;
const metricRows=(w,c,L)=>Object.keys(w||{}).map(k=>`<div class="metric-row"><div><span>${L[k]||k}</span><b>${c?.[k]==null?'—':num(c[k],0)}</b></div>${meter(c?.[k])}</div>`).join('');
function setActive(){const h=location.hash;document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route==='admin'?h.startsWith('#/admin'):a.dataset.route==='dashboard'?h.startsWith('#/dashboard'):a.dataset.route==='methodology'?h.startsWith('#/methodology'):!h.startsWith('#/dashboard')&&!h.startsWith('#/admin')&&!h.startsWith('#/methodology')));const crumb=document.getElementById('crumb');if(crumb)crumb.textContent=h.startsWith('#/admin')?'Control center / Admin':h.startsWith('#/dashboard')?'Workspace / Your servers':h.startsWith('#/methodology')?'Transparency / Methodology':h.startsWith('#/g/')?'Public profile / Server':'Public ranking / Overview'}
function line(values,colors=['#8b7bff','#51d5d0','#ffb86b']){if(!values?.length)return'<div class="empty">Chưa đủ dữ liệu để vẽ biểu đồ.</div>';const all=values.flatMap(x=>x.data),max=Math.max(...all,1),n=Math.max(...values.map(x=>x.data.length));const pts=(data)=>data.map((y,i)=>`${8+i/(Math.max(n-1,1))*584},${212-(y/max)*180}`).join(' ');return`<svg class="chart" viewBox="0 0 600 230" role="img" aria-label="Biểu đồ xu hướng"><path class="area" fill="${colors[0]}" d="M8 212 L${pts(values[0].data)} L${8+(values[0].data.length-1)/Math.max(n-1,1)*584} 212 Z"></path>${values.map((x,i)=>`<polyline stroke="${colors[i]}" points="${pts(x.data)}"></polyline>`).join('')}<line x1="8" y1="212" x2="592" y2="212" stroke="#30405f"/><text x="8" y="228">30 ngày trước</text><text x="530" y="228">Hôm nay</text></svg><div class="legend">${values.map((x,i)=>`<span><i style="background:${colors[i]}"></i>${x.name}</span>`).join('')}</div>`}
function bars(rows){if(!rows?.length)return'<div class="empty">Chưa có dữ liệu theo ngày.</div>';const max=Math.max(...rows.map(x=>x.messages),1);return`<div class="bars">${rows.map(x=>`<div class="bar" style="height:${Math.max(2,x.messages/max*100)}%" title="${esc(x.day)}: ${x.messages} tin"><span>${x.messages}</span></div>`).join('')}</div><div class="muted" style="font-size:11px">Mỗi cột = một ngày · Tổng tin nhắn trong 30 ngày</div>`}
function radar(vals){const labels=['Hoạt động','Phản hồi','Đa dạng','Đều đặn','Đón người mới','Độ phủ'];const cx=150,cy=150,r=105,pt=(v,i)=>{const a=-Math.PI/2+i*Math.PI*2/6;return`${cx+Math.cos(a)*r*v/100},${cy+Math.sin(a)*r*v/100}`};return`<svg class="radar" viewBox="0 0 300 300">${[.33,.66,1].map(s=>`<polygon points="${labels.map((_,i)=>pt(100*s,i)).join(' ')}" fill="none" stroke="#30405f"/>`).join('')} ${labels.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/6;return`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="#30405f"/>`}).join('')}<polygon points="${vals.map((v,i)=>pt(v,i)).join(' ')}" fill="#8b7bff33" stroke="#8b7bff" stroke-width="3"/>${labels.map((x,i)=>{const a=-Math.PI/2+i*Math.PI*2/6;return`<text x="${cx+Math.cos(a)*(r+23)}" y="${cy+Math.sin(a)*(r+23)}" text-anchor="middle" fill="#91a0bc" font-size="10">${x}</text>`}).join('')}</svg>`}
function heat(h){if(!h)return'<div class="empty">Biểu đồ nhiệt sẽ xuất hiện khi đủ mẫu.</div>';const m=Math.max(...h.flat(),1);return`<div class="heat">${h.flat().map((v,i)=>`<i title="${Math.floor(i/24)} · ${i%24}:00 UTC" style="opacity:${.12+.88*v/m}"></i>`).join('')}</div>`}
function summary(s){return`<div class="grid kpis"><div class="card kpi"><h3>Điểm tổng hợp</h3><span class="value" style="color:var(--purple)">${num(s.overall,0)}</span><span class="trend">${s.trend>0?'↗ +':''}${s.trend||''}</span><div class="muted">Top ${s.percentile==null?'—':num(100-s.percentile,0)+'%'}</div></div><div class="card kpi"><h3>Hoạt động cộng đồng</h3><span class="value" style="color:var(--orange)">${num(s.activity,0)}</span><div class="muted">Nhịp trò chuyện & tương tác</div></div><div class="card kpi"><h3>Đón người mới</h3><span class="value" style="color:var(--cyan)">${num(s.welcoming,0)}</span><div class="muted">Phản hồi & giữ chân</div></div></div>`}
async function home(){const f=new URLSearchParams(location.hash.split('?')[1]||'');let rows;try{rows=await api('/leaderboard?'+f)}catch(e){if(e.status===404){view(`<div class="card rise"><span class="eyebrow">Private mode</span><h1>Bảng xếp hạng đang được tạm ẩn</h1><p class="muted">Admin đang hoàn thiện dữ liệu cộng đồng. Tính năng sẽ xuất hiện khi hệ thống sẵn sàng.</p></div>`);return}throw e}view(`<div class="section-head"><div><span class="eyebrow">unzi · public server ranking</span><h1>Nhìn thấy sức sống<br>của server bạn.</h1><p class="muted">Unzi là bảng xếp hạng công khai cho cộng đồng Discord. Không xếp loại server theo khuôn mẫu; hệ thống quan sát nhịp trò chuyện, chất lượng tương tác và cách server đón người mới.</p></div><a class="btn primary" id="heroCta" href="/auth/login">+ Thêm bot để tham gia</a></div><div class="landing-note"><i></i><div><b>Minh bạch theo thiết kế.</b><br>Unzi chỉ sử dụng metadata đã ẩn danh, không đọc nội dung tin nhắn. Mọi server đều được đánh giá trên cùng một hệ thống đo lường.</div></div><div class="grid split2" style="margin-top:22px"><div class="card"><h2 style="margin-top:0">Unzi hoạt động thế nào?</h2><p class="muted">Bot tự động tham gia xếp hạng ngay khi được thêm vào server. Dữ liệu được ẩn danh và tổng hợp thành điểm số dễ so sánh.</p></div><div class="card"><h2 style="margin-top:0">Một bảng xếp hạng mở</h2><p class="muted">Mọi người đều có thể xem profile, biểu đồ và xu hướng của server. Server chỉ rời bảng xếp hạng khi bot bị kick khỏi server.</p></div></div><div class="toolbar"><select class="field" id="fc"><option value="">Tất cả danh mục</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${f.get('category')===k?'selected':''}>${v}</option>`).join('')}</select><select class="field" id="fl"><option value="">Mọi ngôn ngữ</option><option value="vi">Tiếng Việt</option><option value="en">English</option></select></div><div class="section-head"><h2>Xếp hạng cộng đồng</h2><span class="muted">${rows.length} server đang hiển thị</span></div><div class="server-list">${rows.length?rows.map((r,i)=>`<a class="server rise" style="animation-delay:${i*35}ms" href="#/g/${esc(r.id)}">${icon(r)}<div class="server-main"><b>${esc(r.name)}</b><span class="server-meta">${tags(r.categories)||'Chưa gắn nhãn'} · ${ST[r.status]||r.status}</span></div><div>${status(r.confidence>=60?'Dữ liệu tốt':'Đang tích lũy',r.confidence>=60)}</div><div class="server-score"><strong>${num(r.overall??r.activity,0)}</strong><small class="muted"> / 100</small></div></a>`).join(''):'<div class="empty">Chưa có server công khai đủ dữ liệu.</div>'}</div>`);const go=()=>{const p=new URLSearchParams();if(fc.value)p.set('category',fc.value);if(fl.value)p.set('language',fl.value);location.hash='#/?'+p};fc.onchange=fl.onchange=go}
async function profile(id){let d;try{d=await api('/guilds/'+id)}catch(e){if(e.status!==404)throw e;d=await api('/my/guilds/'+id)}const g=d.guild,s=d.score,b=s?.components;const daily=d.daily||[];const metrics=b?Object.values(b.activity||{}).filter(x=>x!=null):[];const joined=d.ranking??true;view(`<a class="muted" href="#/">← Quay lại xếp hạng</a><div class="hero" style="margin-top:22px"><div><div class="profile-title">${icon(g)}<div><h1>${esc(g.name)}</h1><span class="muted">${tags(g.categories)||'Community'} ${g.description?' · '+esc(g.description):''}</span></div></div></div>${joined?(s?status(ST[s.status],s.status==='ranked'):status('Đang tích lũy')):status('Chưa tham gia xếp hạng')}</div>${joined?(s?summary(s):'<div class="notice" style="margin-top:25px">Server đang tích lũy dữ liệu. Các chỉ số sẽ mở khóa khi có đủ mẫu.</div>'):'<div class="notice" style="margin-top:25px">Server này chưa tham gia xếp hạng. Chủ server có thể thêm bot để Unzi bắt đầu đo dữ liệu.</div>'}${joined?`<div class="grid split" style="margin-top:16px"><div class="card"><div class="section-head"><div><h2 style="margin-top:0">Nhịp trò chuyện</h2><p class="muted">Tin nhắn theo ngày trong 30 ngày gần nhất</p></div></div>${bars(daily)}</div><div class="card"><h2 style="margin-top:0">Radar sức khỏe</h2>${radar(metrics.length?[metrics[0],b.activity.Q||0,b.activity.D||0,b.activity.C||0,s?.welcoming||0,s.confidence]:[0,0,0,0,0,0])}</div></div><div class="grid split2" style="margin-top:16px"><div class="card"><h2 style="margin-top:0">Các chỉ số theo thời gian</h2>${line([{name:'Hoạt động',data:d.history.map(x=>x.activity||0)},{name:'Đón người mới',data:d.history.map(x=>x.welcoming||0)},{name:'Tổng hợp',data:d.history.map(x=>x.overall||0)}])}</div><div class="card"><h2 style="margin-top:0">Phân bố giờ hoạt động</h2><p class="muted">Giờ UTC · càng sáng càng nhiều tương tác</p>${heat(d.heat)}</div></div><div class="grid split2"><div><h2>Hoạt động</h2><div class="card">${metricRows(s?.weights?.activity,b?.activity,LA)}</div></div><div><h2>Đón người mới</h2><div class="card">${metricRows(s?.weights?.welcoming,b?.welcoming,LW)}</div></div></div>`:''}`)}
async function dashboard(){const d=await api('/admin/guilds');view(`<div class="section-head"><div><span class="eyebrow">Workspace</span><h1>Server bạn tham gia</h1><p class="muted">Mọi server trong tài khoản Discord đều hiển thị. Click vào server để mở profile; Unzi chỉ bắt đầu xếp hạng sau khi bot được thêm.</p></div><a class="btn ghost" href="/auth/logout">Đăng xuất</a></div><div class="server-list">${d.guilds.map(g=>`<div class="server"><a href="#/g/${g.id}">${icon(g)}</a><div class="server-main"><a href="#/g/${g.id}"><b>${esc(g.name)}</b></a><span class="server-meta">${g.bot_present?'Đã tham gia xếp hạng':'Chưa tham gia xếp hạng'}</span></div>${g.bot_present?status('Đã tham gia',true):g.can_manage&&g.invite?`<a class="btn primary" href="${esc(g.invite)}">+ Thêm bot</a>`:status('Chưa tham gia')}</div>`).join('')||'<div class="empty">Discord không trả về server nào.</div>'}</div>`)}
async function dash(id){location.hash='#/g/'+id}
async function methodology(){await api('/methodology');view(`<span class="eyebrow">Transparency</span><h1>Cách Unzi đo cộng đồng</h1><p class="muted">Không dùng số thành viên, boost hay quảng cáo để tính điểm. Chỉ dùng metadata đã ẩn danh.</p><div class="grid split2"><div class="card"><h2 style="margin-top:0">Hoạt động</h2>${metricRows({U:.2,F:.15,Q:.25,C:.2,D:.1,T:.1},{U:80,F:72,Q:68,C:76,D:61,T:84},LA)}</div><div class="card"><h2 style="margin-top:0">Đón người mới</h2>${metricRows({R:.25,F:.2,C:.2,D7:.2,D:.1,V:.05},{R:72,F:65,C:80,D7:58,D:74,V:92},LW)}</div></div><div class="notice" style="margin-top:16px">Unzi không đọc nội dung tin nhắn. Event thô chỉ giữ trong thời gian ngắn; dữ liệu tổng hợp phục vụ phân tích dài hạn.</div>`)}
async function admin(){const d=await api('/admin/overview');const c=d.counts;view(`<div class="section-head"><div><span class="eyebrow">Control center</span><h1>Admin panel</h1><p class="muted">Theo dõi sức khỏe hệ thống, quản trị server và tính năng nhạy cảm.</p></div>${status('Admin access',true)}</div><div class="grid kpis"><div class="card kpi"><h3>Tổng server</h3><span class="value">${c.total||0}</span><div class="muted">${c.connected||0} đã kết nối bot</div></div><div class="card kpi"><h3>Đang theo dõi</h3><span class="value" style="color:var(--cyan)">${c.tracking||0}</span><div class="muted">${c.events24h||0} events / 24h</div></div><div class="card kpi"><h3>Đang công khai</h3><span class="value" style="color:var(--purple)">${c.public_count||0}</span><div class="muted">server trong bảng xếp hạng</div></div></div><div class="grid split2"><div class="card"><h2 style="margin-top:0">Feature flags</h2><p class="muted">Tắt hoàn toàn tính năng nhạy cảm khi hệ thống chưa đủ dữ liệu.</p>${[['public_leaderboard','Bảng xếp hạng công khai','Ẩn toàn bộ route và dữ liệu ranking'],['public_profiles','Hồ sơ server công khai','Ẩn các profile khỏi người dùng'],['public_methodology','Trang phương pháp','Ẩn thông tin thuật toán chi tiết']].map(([k,t,sub])=>`<label class="switch-row"><span><b>${t}</b><br><small class="muted">${sub}</small></span><button type="button" class="switch ${d.settings[k]?'on':''}" data-setting="${k}"><i></i></button></label>`).join('')}<p id="setting-msg" class="muted"></p></div><div class="card"><h2 style="margin-top:0">Sức khỏe dữ liệu</h2>${line([{name:'Tin nhắn',data:d.history.map(x=>Number(x.messages||0))},{name:'Reply',data:d.history.map(x=>Number(x.replies||0))},{name:'Server hoạt động',data:d.history.map(x=>Number(x.active_servers||0))}],['#51d5d0','#ffb86b','#8b7bff'])}<div class="notice">Tín hiệu spike chỉ là cờ kiểm tra, không phải kết luận gian lận.</div></div></div><div class="card" style="margin-top:16px"><div class="section-head"><h2 style="margin-top:0">Giám sát server</h2><span class="muted">${d.guilds.length} records</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>Server</th><th>Bot</th><th>Trạng thái</th><th>Điểm</th><th>Confidence</th><th>Heartbeat</th></tr></thead><tbody>${d.guilds.map(g=>`<tr><td><b>${esc(g.name)}</b><br><small class="muted">${g.id}</small></td><td>${g.bot_present?status('Connected',true):status('Missing')}</td><td>${g.bot_present?status('Participating',true):status('Not ranked')}</td><td>${num(g.overall,0)}</td><td>${num(g.confidence,0)}</td><td class="muted">${g.last_heartbeat?new Date(g.last_heartbeat).toLocaleString('vi-VN'):'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="card" style="margin-top:16px"><h2 style="margin-top:0">Điều chỉnh điểm thủ công</h2><p class="muted">Dùng điểm dương để cộng, điểm âm để trừ. Thay đổi được ghi audit và áp dụng ở lần tính điểm kế tiếp.</p><div class="toolbar"><select class="field" id="adjust-guild">${d.guilds.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><input class="field" id="adjust-points" type="number" min="-100" max="100" step="0.5" placeholder="+/- điểm"><input class="field" id="adjust-reason" maxlength="255" placeholder="Lý do"></div><button class="btn primary" id="adjust-save">Lưu điều chỉnh</button><p id="adjust-msg" class="muted"></p><div class="muted" style="margin-top:14px">${d.adjustments.map(a=>`${esc(a.name||a.guild_id)}: ${Number(a.points)>0?'+':''}${a.points} · ${esc(a.reason)}`).join('<br>')||'Chưa có điều chỉnh.'}</div></div><div class="card" style="margin-top:16px"><h2 style="margin-top:0">Audit log gần đây</h2>${d.audit.map(a=>`<p class="muted" style="border-bottom:1px solid var(--line);padding-bottom:8px">${new Date(a.created_at).toLocaleString('vi-VN')} · <b>${esc(a.action)}</b> · ${esc(a.guild_id||'system')}</p>`).join('')||'<p class="muted">Chưa có hoạt động.</p>'}</div>`);document.querySelectorAll('[data-setting]').forEach(btn=>btn.onclick=async()=>{const key=btn.dataset.setting;try{const r=await api('/admin/settings',{method:'PATCH',body:JSON.stringify({[key]:!btn.classList.contains('on')})});btn.classList.toggle('on',r.settings[key]);document.getElementById('setting-msg').textContent='Đã cập nhật feature flag.'}catch{document.getElementById('setting-msg').textContent='Không thể cập nhật. Bạn không có quyền admin.'}})}
document.addEventListener('click',e=>{if(e.target.id!=='adjust-save')return;const points=Number(document.getElementById('adjust-points').value),reason=document.getElementById('adjust-reason').value.trim(),guild_id=document.getElementById('adjust-guild').value;api('/admin/guilds/'+guild_id+'/adjustment',{method:'POST',body:JSON.stringify({points,reason})}).then(()=>document.getElementById('adjust-msg').textContent='Đã lưu. Điểm mới xuất hiện sau lần tính kế tiếp.').catch(()=>document.getElementById('adjust-msg').textContent='Không thể lưu điều chỉnh.')});
const fail=e=>view(e.status===401?'<div class="card"><h1>Đăng nhập để tiếp tục</h1><p class="muted">Dùng Discord để xem server và mở dashboard riêng.</p><a class="btn primary" href="/auth/login">Đăng nhập bằng Discord</a></div>':e.status===403?'<div class="card"><h1>Không có quyền</h1><p class="muted">Khu vực này chỉ dành cho admin hệ thống.</p></div>':e.status===404?'<div class="card"><h1>Tính năng đang ẩn</h1><p class="muted">Admin đã tạm ẩn nội dung này trong giai đoạn thu thập dữ liệu.</p></div>':'<div class="card"><h1>Có lỗi xảy ra</h1><p class="muted">Thử tải lại trang sau ít phút.</p></div>');
const R=[[/^#\/g\/(\d+)$/,profile],[/^#\/dashboard\/(\d+)$/,dash],[/^#\/dashboard$/,dashboard],[/^#\/methodology$/,methodology],[/^#\/admin$/,admin]];
function route(){const h=location.hash||'#/';for(const[r,f]of R){const m=h.match(r);if(m)return f(m[1]).catch(fail)}return home().catch(fail)}addEventListener('hashchange',route);route();
</script></body></html>
