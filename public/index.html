<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121a24;--sf:#1a2431;--ln:#2a3646;--tx:#e9edf2;--mu:#93a1b2;--act:#f2a65a;--wel:#4fc4ae;--ovr:#b9a8ff;--bad:#e5736a}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f8;--sf:#fff;--ln:#d8dee6;--tx:#17212c;--mu:#5d6b7b;--act:#c97a1c;--wel:#16897a;--ovr:#6b55d6;--bad:#c4473d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
a{color:inherit}.mu{color:var(--mu)}
header,main{max-width:960px;margin:0 auto;padding:0 20px}
header{display:flex;gap:22px;align-items:center;height:56px;border-bottom:1px solid var(--ln);max-width:none;padding:0 max(20px,calc(50% - 480px))}
header b{font-weight:800;margin-right:auto}header a{text-decoration:none;color:var(--mu)}header a:hover{color:var(--tx)}
h1{font-size:clamp(26px,5vw,40px);line-height:1.15;font-weight:800;margin:36px 0 10px;max-width:20ch}
h2{font-size:17px;margin:32px 0 10px}h3{font-size:14px;margin:0 0 8px;color:var(--mu);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--ln);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c)}
.bar.low i{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px)}
.row{display:grid;grid-template-columns:1.6fr 1fr 1fr 80px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);text-decoration:none}
.row:hover{background:var(--sf)}.row img,.ph{width:32px;height:32px;border-radius:50%;background:var(--ln);flex:none}
.nm{display:flex;gap:12px;align-items:center;min-width:0}.nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small,.sc small{display:block;color:var(--mu);font-size:12px}
.sc span{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.ov{text-align:right;font-weight:800;font-size:22px;color:var(--ovr)}.ov small{font-weight:400;font-size:12px;color:var(--mu)}
.f{display:flex;gap:10px;margin:18px 0}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button.p{background:var(--ovr);color:#121a24;border-color:transparent;font-weight:600}button.d{color:var(--bad)}
:focus-visible{outline:2px solid var(--ovr);outline-offset:2px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:22px 0}
.hero .big{font-size:40px;font-weight:800;line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}.cp{margin-bottom:10px}
.ch{width:100%;height:120px;background:var(--sf);border-radius:6px}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}.heat i{aspect-ratio:1;background:var(--act);border-radius:2px}
form label{display:block;margin:10px 0 4px}form .ck{display:inline-flex;gap:6px;margin:0 14px 6px 0}
textarea,form input[type=text]{width:100%}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px 16px;margin:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row .nm{grid-column:1/3}.two,.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>Community Intelligence</b><a href="#/">Xếp hạng</a><a href="#/methodology">Cách tính</a><a href="#/dashboard">Dashboard</a></header>
<main id="v"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,o)=>fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o}).then(r=>{if(!r.ok)throw Object.assign(new Error(r.status),{status:r.status});return r.json()});
const num=(v,d=1)=>v==null?'—':Number(v).toFixed(d);
const view=h=>{document.getElementById('v').innerHTML=h;scrollTo(0,0)};
const ST={collecting:'Đang thu thập',provisional:'Tạm thời',ranked:'Đã xếp hạng',limited:'Dữ liệu hạn chế',review:'Đang kiểm tra',paused:'Tạm dừng'};
const CATS={gaming:'Gaming',education:'Học tập',technology:'Công nghệ',creator:'Sáng tạo',social:'Giao lưu',support:'Hỗ trợ',fan:'Fan',marketplace:'Giao dịch',other:'Khác'};
const LA={U:'Người tham gia',F:'Tần suất trò chuyện',Q:'Chất lượng tương tác',C:'Độ đều đặn',D:'Đa dạng tương tác',T:'Phân bố giờ và kênh'};
const LW={R:'Người mới được phản hồi',F:'Tốc độ phản hồi đầu tiên',C:'Người mới có trao đổi hai chiều',D7:'Còn hoạt động sau 7 ngày',D:'Số người đón tiếp khác nhau',V:'Độ phủ dữ liệu'};
// thanh gạch chéo = độ tin cậy dữ liệu dưới 60
const bar=(v,c,low)=>`<div class="bar${low?' low':''}" style="--c:var(--${c})"><i style="width:${v==null?0:Math.min(100,v)}%"></i></div>`;
const icon=g=>g.icon?`<img alt="" src="https://cdn.discordapp.com/icons/${esc(g.id)}/${esc(g.icon)}.png?size=64">`:'<span class="ph"></span>';
const tags=c=>(c||[]).map(x=>CATS[x]||x).join(', ');
const comps=(w,c,L)=>Object.keys(w).map(k=>`<div class="cp"><span>${L[k]} <small class="mu">${Math.round(w[k]*100)}%</small></span>${c&&c[k]!=null?bar(c[k],'act'):'<small class="mu">Chưa đủ dữ liệu</small>'}</div>`).join('');
const line=(v,c)=>{v=v.map(Number);if(v.length<2)return'<p class="mu">Chưa đủ dữ liệu để vẽ xu hướng.</p>';const m=Math.max(...v,1);
  return`<svg viewBox="0 0 600 120" class="ch" role="img" aria-label="Biểu đồ xu hướng"><polyline fill="none" stroke="var(--${c})" stroke-width="2" points="${v.map((y,i)=>`${(i/(v.length-1)*584+8).toFixed(1)},${(112-y/m*104).toFixed(1)}`).join(' ')}"/></svg>`};
const heat=h=>{const m=Math.max(...h.flat(),1);return['CN','T2','T3','T4','T5','T6','T7'].map((d,i)=>`<div class="mu" style="font-size:12px">${d}</div><div class="heat">${h[i].map((v,hr)=>`<i title="${hr}h: ${v}" style="opacity:${(.08+.92*v/m).toFixed(2)}"></i>`).join('')}</div>`).join('')};
const summary=s=>`<div class="hero">
  <div><div class="big" style="color:var(--ovr)">${num(s.overall)}</div>Tổng hợp${s.percentile!=null?` · top ${num(100-s.percentile,0)}% nhóm`:''}</div>
  <div><div class="big" style="color:var(--act)">${num(s.activity)}</div>Hoạt động</div>
  <div><div class="big" style="color:var(--wel)">${num(s.welcoming)}</div>Đón người mới</div></div>
  <p class="mu">Độ tin cậy dữ liệu <b>${num(s.confidence,0)}</b>/100 · ${ST[s.status||s.ranking_status]}${s.overall==null?' · Điểm tổng hợp cần đủ cả hai nhóm dữ liệu':''}</p>`;

async function lb(){
  const f=new URLSearchParams((location.hash.split('?')[1])||''),rows=await api('/leaderboard?'+f);
  view(`<h1>Xếp hạng theo những gì thực sự diễn ra trong server</h1>
  <p class="mu">Điểm đo hoạt động và cách đón người mới trong 30 ngày, không tính số thành viên. Thanh gạch chéo nghĩa là dữ liệu còn mỏng.</p>
  <div class="f"><select id="fc" aria-label="Danh mục"><option value="">Mọi danh mục</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${f.get('category')===k?' selected':''}>${v}</option>`).join('')}</select>
  <select id="fl" aria-label="Ngôn ngữ"><option value="">Mọi ngôn ngữ</option><option value="vi"${f.get('language')==='vi'?' selected':''}>Tiếng Việt</option><option value="en"${f.get('language')==='en'?' selected':''}>English</option></select></div>
  ${rows.length?rows.map(r=>{const low=r.confidence<60;return`<a class="row" href="#/g/${esc(r.id)}">
    <div class="nm">${icon(r)}<div><b>${esc(r.name)}</b><small>${esc(tags(r.categories))} · ${ST[r.status]}</small></div></div>
    <div class="sc"><span>Hoạt động<b>${num(r.activity)}</b></span>${bar(r.activity,'act',low)}</div>
    <div class="sc"><span>Đón người mới<b>${num(r.welcoming)}</b></span>${bar(r.welcoming,'wel',low)}</div>
    <div class="ov">${num(r.overall??r.activity,0)}<small>${r.trend==null?'':(r.trend>0?'+':'')+r.trend+' / 30 ngày'}</small></div></a>`}).join(''):'<p class="mu">Chưa có server nào đủ dữ liệu để hiển thị.</p>'}`);
  const go=()=>{const p=new URLSearchParams();if(fc.value)p.set('category',fc.value);if(fl.value)p.set('language',fl.value);location.hash='#/?'+p};
  fc.onchange=fl.onchange=go;
}

async function prof(id){
  const d=await api('/guilds/'+id),g=d.guild,s=d.score;
  view(`<a class="mu" href="#/">← Bảng xếp hạng</a><div class="nm" style="margin-top:20px">${icon(g)}<h1 style="margin:0;font-size:30px">${esc(g.name)}</h1></div>
  <p class="mu">${esc(tags(g.categories))}${g.description?' · '+esc(g.description):''}</p>
  ${g.invite_url?`<p><a href="${esc(g.invite_url)}" rel="noopener">Tham gia server</a></p>`:''}
  ${s?`${summary(s)}<h2>Vì sao điểm này?</h2><div class="two"><div><h3>Hoạt động</h3>${comps(s.weights.activity,s.components.activity,LA)}</div>
    <div><h3>Đón người mới</h3>${comps(s.weights.welcoming,s.components.welcoming,LW)}
    <p class="mu">Mẫu người mới: ${s.welcome.eligibleNew} · được phản hồi ${num(s.welcome.responseRate,0)}% · phản hồi đầu tiên trung vị ${num(s.welcome.medianMin,0)} phút (P90 ${num(s.welcome.p90Min,0)}) · còn hoạt động D7 ${num(s.welcome.d7Rate,0)}%. Retention chỉ là tương quan.</p></div></div>
    <h2>Xu hướng điểm tổng hợp</h2>${line(d.history.map(h=>h.overall??h.activity??0),'ovr')}`:'<p class="mu">Chưa có điểm.</p>'}
  ${d.daily?`<h2>Người hoạt động mỗi ngày</h2>${line(d.daily.map(x=>x.unique_active),'act')}<h2>Giờ cao điểm (UTC)</h2>${heat(d.heat)}`:'<p class="mu">Biểu đồ chi tiết ẩn vì mẫu còn quá nhỏ.</p>'}`);
}

async function meth(){
  const m=await api('/methodology');
  view(`<h1>Cách tính điểm</h1><p class="mu">Phiên bản thuật toán: ${m.version}. Cửa sổ chính: ${m.window}.</p>
  <h2>Hoạt động</h2>${Object.entries(m.weights.activity).map(([k,w])=>`<p>${LA[k]}: ${w*100}%</p>`).join('')}
  <h2>Đón người mới</h2>${Object.entries(m.weights.welcoming).map(([k,w])=>`<p>${LW[k]}: ${w*100}%</p>`).join('')}
  <h2>Tổng hợp</h2><p>${m.weights.overall.activity*100}% Hoạt động + ${m.weights.overall.welcoming*100}% Đón người mới</p>
  <h2>Nguyên tắc</h2>${m.notes.map(n=>`<p>${esc(n)}</p>`).join('')}`);
}

async function dashList(){
  const d=await api('/admin/guilds');
  view(`<h1>Server của bạn</h1><p class="mu">Đăng nhập là ${esc(d.user.name)} · <a href="/auth/logout">Đăng xuất</a></p>
  ${d.guilds.length?d.guilds.map(g=>`<div class="card"><b>${esc(g.name)}</b>${g.bot_present?`<a href="#/dashboard/${esc(g.id)}">Mở dashboard</a>`:`<a href="${esc(g.invite)}">Mời bot vào server</a>`}</div>`).join(''):'<p class="mu">Bạn chưa có quyền Manage Server ở server nào.</p>'}`);
}

async function dash(id){
  const d=await api('/admin/guilds/'+id),g=d.guild,s=d.score,b=s?.breakdown,chs=g.channels||[],sel=g.selected_channels;
  const name=cid=>esc((chs.find(c=>c.id===cid)||{}).name||cid);
  view(`<a class="mu" href="#/dashboard">← Server của bạn</a><h1>${esc(g.name)}</h1>
  ${s?summary(s):'<p class="mu">Chưa có điểm. Bật thu thập, lần tính đầu tiên chạy trong tối đa 1 giờ.</p>'}
  ${b?`<h2>Vì sao điểm này?</h2><div class="two"><div><h3>Hoạt động</h3>${comps(b.weights.activity,b.activity,LA)}</div><div><h3>Đón người mới</h3>${comps(b.weights.welcoming,b.welcoming,LW)}</div></div>
   ${b.flags.length?`<p class="mu">Cờ bất thường: ${b.flags.join(', ')} (chỉ là tín hiệu kiểm tra, không phải kết luận gian lận).</p>`:''}
   <h2>Người hoạt động mỗi ngày</h2>${line(d.daily.map(x=>x.unique_active),'act')}
   <h2>Giờ cao điểm (UTC)</h2>${heat(b.heat)}
   <h2>Phân bố theo kênh</h2>${b.channels.map(c=>`<div class="cp"><span>#${name(c.id)} <small class="mu">${c.share}%</small></span>${bar(c.share,'wel')}</div>`).join('')}`:''}
  <h2>Sức khỏe dữ liệu</h2><p class="mu">Sự kiện 24 giờ qua: ${d.health.events24h} · Độ phủ: ${num(b?.coverage,0)}% · Ngày quan sát: ${b?.obsDays??0} · Tính lần cuối: ${s?new Date(s.computed_at).toLocaleString('vi-VN'):'—'}</p>
  <h2>Cấu hình</h2><form id="cfg">
   <label>Mô tả công khai</label><textarea name="description" rows="3" maxlength="500">${esc(g.description)}</textarea>
   <label>Link mời (discord.gg/...)</label><input type="text" name="invite_url" value="${esc(g.invite_url)}">
   <label>Danh mục (tối đa 3)</label>${Object.entries(CATS).map(([k,v])=>`<label class="ck"><input type="checkbox" name="cat" value="${k}"${(g.categories||[]).includes(k)?' checked':''}>${v}</label>`).join('')}
   <label>Ngôn ngữ</label><select name="language"><option value="vi"${g.language==='vi'?' selected':''}>Tiếng Việt</option><option value="en"${g.language==='en'?' selected':''}>English</option></select>
   <label>Kênh được đo (bỏ trống = tất cả kênh bot thấy)</label>${chs.map(c=>`<label class="ck"><input type="checkbox" name="ch" value="${esc(c.id)}"${sel&&sel.includes(c.id)?' checked':''}>#${esc(c.name)}</label>`).join('')}
   <label class="ck"><input type="checkbox" name="is_public"${g.is_public?' checked':''}>Hiện server trên bảng xếp hạng công khai</label><br>
   <label class="ck"><input type="checkbox" name="consent"${g.enabled?' checked':''}>Tôi đồng ý bật thu thập: bot ghi thời điểm, kênh và mã băm của người gửi/người được trả lời, không đọc nội dung tin nhắn. Sự kiện thô tự xóa sau vài tuần.</label>
   <p><button class="p" type="submit">Lưu cấu hình</button> <button type="button" id="pz">${g.paused?'Tiếp tục thu thập':'Tạm dừng thu thập'}</button> <button type="button" class="d" id="ul">Ngừng theo dõi và xóa dữ liệu</button></p><p id="msg" class="mu" role="status"></p></form>`);
  const F=document.getElementById('cfg'),msg=t=>document.getElementById('msg').textContent=t;
  F.onsubmit=async e=>{e.preventDefault();const f=new FormData(F),ch=f.getAll('ch'),on=F.consent.checked;
    try{await api(`/admin/guilds/${id}/config`,{method:'PATCH',body:JSON.stringify({description:f.get('description'),invite_url:f.get('invite_url'),categories:f.getAll('cat'),language:f.get('language'),
      selected_channels:ch.length?ch:null,is_public:F.is_public.checked,enabled:on,consent:on})});msg('Đã lưu.')}catch{msg('Không lưu được. Kiểm tra link mời hoặc đăng nhập lại.')}};
  document.getElementById('pz').onclick=async()=>{await api(`/admin/guilds/${id}/${g.paused?'resume':'pause'}`,{method:'POST'});dash(id)};
  document.getElementById('ul').onclick=async()=>{if(!confirm('Xóa toàn bộ sự kiện, số liệu và điểm của server này? Không thể hoàn tác.'))return;await api(`/admin/guilds/${id}/unlink`,{method:'POST'});location.hash='#/dashboard'};
}

const fail=e=>view(e.status===401?'<h1>Đăng nhập để quản lý server</h1><p><a href="/auth/login"><button class="p">Đăng nhập bằng Discord</button></a></p>'
  :e.status===404?'<h1>Không tìm thấy</h1><p class="mu">Server chưa có bot hoặc không công khai.</p>':'<h1>Có lỗi xảy ra</h1><p class="mu">Thử tải lại trang.</p>');
const R=[[/^#\/g\/(\d+)$/,prof],[/^#\/dashboard\/(\d+)$/,dash],[/^#\/dashboard$/,dashList],[/^#\/methodology$/,meth]];
function route(){const h=location.hash||'#/';for(const[r,f]of R){const m=h.match(r);if(m)return f(m[1]).catch(fail)}return lb().catch(fail)}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
