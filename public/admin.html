<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · unzi</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="layout"><aside class="sidebar"><a class="brand" href="/"><i class="brand-mark"></i><span>unzi</span></a><nav class="nav"><div class="nav-label">Control center</div><a class="active" href="/admin.html">◉ <span>Overview</span></a><a href="/dashboard.html">▣ <span>Server workspace</span></a><a href="/#ranking">✦ <span>Public ranking</span></a></nav><div class="sidebar-foot">restricted access<br>audit enabled</div></aside><main class="workspace"><header class="topbar"><span class="crumb">Control center / Admin</span><div class="top-actions"><a class="btn ghost" href="/auth/logout">Đăng xuất</a><a class="btn primary" href="/">Trang chủ</a></div></header><div id="app"></div></main></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=(p,o)=>fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{if(!r.ok)throw Object.assign(new Error(r.status),{status:r.status});return r.json()});const status=(t,ok)=>`<span class="status ${ok?'ok':''}">${t}</span>`;const num=(v,d=0)=>v==null?'—':Number(v).toFixed(d);
async function load(){const root=document.getElementById('app');try{const d=await api('/admin/overview'),c=d.counts;root.innerHTML=`<section><span class="eyebrow">Control center</span><h1>Admin panel</h1><p class="muted">Quản trị quy mô lớn, theo dõi sức khỏe hệ thống và kiểm soát những tính năng được công khai.</p></section><div class="grid kpis"><div class="card"><span class="kpi-label">Tổng server</span><strong class="kpi-value">${c.total||0}</strong><span class="muted">${c.connected||0} bot đang hiện diện</span></div><div class="card"><span class="kpi-label">Events 24 giờ</span><strong class="kpi-value" style="color:var(--cyan)">${c.events24h||0}</strong><span class="muted">tín hiệu đã ghi nhận</span></div><div class="card"><span class="kpi-label">Đang công khai</span><strong class="kpi-value" style="color:var(--brand)">${c.public_count||0}</strong><span class="muted">server trong ranking</span></div></div><div class="grid two"><section class="card"><h2>Feature flags</h2><p class="muted">Ẩn toàn bộ tính năng thay vì hiển thị trạng thái rỗng khi hệ thống chưa đủ dữ liệu.</p>${[['public_leaderboard','Public leaderboard'],['public_profiles','Public server profiles'],['public_methodology','Methodology page']].map(([key,label])=>`<label class="server"><span class="server-main"><b>${label}</b><span class="server-meta">Bật/tắt toàn bộ route công khai</span></span><button class="btn ${d.settings[key]?'primary':'ghost'} flag" data-key="${key}">${d.settings[key]?'Đang bật':'Đang tắt'}</button></label>`).join('')}<p id="flag-msg" class="muted"></p></section><section class="card"><h2>Điều chỉnh điểm</h2><p class="muted">Cộng hoặc trừ điểm thủ công, mọi thay đổi đều được audit.</p><select class="field" id="guild" style="width:100%;margin-bottom:9px">${d.guilds.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><div class="toolbar"><input class="field" id="points" type="number" min="-100" max="100" step=".5" placeholder="+/- điểm"><input class="field" id="reason" maxlength="255" placeholder="Lý do"></div><button class="btn primary" id="save-adjust">Lưu điều chỉnh</button><p id="adjust-msg" class="muted"></p></section></div><div class="card" style="margin-top:16px"><div class="section-head"><div><h2>Server monitoring</h2><span class="muted">${d.guilds.length} records · tối đa 500 server</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Server</th><th>Bot</th><th>Ranking</th><th>Overall</th><th>Confidence</th><th>Heartbeat</th></tr></thead><tbody>${d.guilds.map(g=>`<tr><td><b>${esc(g.name)}</b><br><span class="muted">${g.id}</span></td><td>${g.bot_present?status('Connected',true):status('Missing')}</td><td>${g.bot_present?status('Participating',true):status('Not ranked')}</td><td>${num(g.overall)}</td><td>${num(g.confidence)}%</td><td class="muted">${g.last_heartbeat?new Date(g.last_heartbeat).toLocaleString('vi-VN'):'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="card" style="margin-top:16px"><h2>Audit log</h2>${d.audit.map(a=>`<p class="muted">${new Date(a.created_at).toLocaleString('vi-VN')} · <b>${esc(a.action)}</b> · ${esc(a.guild_id||'system')}</p>`).join('')||'<p class="muted">Chưa có hoạt động.</p>'}</div>`;document.querySelectorAll('.flag').forEach(button=>button.onclick=async()=>{try{const key=button.dataset.key,r=await api('/admin/settings',{method:'PATCH',body:JSON.stringify({[key]:!d.settings[key]})});d.settings[key]=r.settings[key];button.className=`btn ${d.settings[key]?'primary':'ghost'} flag`;button.textContent=d.settings[key]?'Đang bật':'Đang tắt';document.getElementById('flag-msg').textContent='Đã cập nhật.'}catch{document.getElementById('flag-msg').textContent='Không thể cập nhật feature flag.'}});document.getElementById('save-adjust').onclick=async()=>{const id=document.getElementById('guild').value,points=Number(document.getElementById('points').value),reason=document.getElementById('reason').value.trim();try{await api('/admin/guilds/'+id+'/adjustment',{method:'POST',body:JSON.stringify({points,reason})});document.getElementById('adjust-msg').textContent='Đã lưu; áp dụng ở lần tính điểm kế tiếp.'}catch{document.getElementById('adjust-msg').textContent='Dữ liệu không hợp lệ hoặc không có quyền.'}}}catch(e){root.innerHTML=e.status===401?'<div class="card"><h1>Đăng nhập admin</h1><p class="muted">Khu vực này yêu cầu phiên Discord hợp lệ.</p><a class="btn primary" href="/auth/login">Đăng nhập Discord</a></div>':e.status===403?'<div class="card"><h1>Truy cập bị từ chối</h1><p class="muted">Tài khoản này không nằm trong danh sách admin.</p></div>':'<div class="card notice">Không thể tải admin panel.</div>'}}load();
</script></body></html>
