<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · unzi</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="layout"><aside class="sidebar"><a class="brand" href="/"><i class="brand-mark"></i><span>unzi</span></a><nav class="nav"><div class="nav-label">Workspace</div><a class="active" href="/dashboard.html">◉ <span>Server của tôi</span></a><a href="/#ranking">✦ <span>Xếp hạng công khai</span></a><div class="nav-label">Trust</div><a href="/methodology.html">◌ <span>Cách tính điểm</span></a></nav><div class="sidebar-foot">privacy-first<br>community intelligence</div></aside><main class="workspace"><header class="topbar"><span class="crumb">Workspace / Your servers</span><div class="top-actions"><a class="btn ghost" id="logout" href="/auth/logout">Đăng xuất</a><a class="btn primary" href="/">Trang chủ</a></div></header><div id="app"></div></main></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=(p,o)=>fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{if(!r.ok)throw Object.assign(new Error(r.status),{status:r.status});return r.json()});const icon=g=>g?.icon?`<img class="avatar" alt="" src="https://cdn.discordapp.com/icons/${esc(g.id)}/${esc(g.icon)}.png?size=128">`:`<span class="avatar"></span>`;const status=(t,ok)=>`<span class="status ${ok?'ok':''}">${t}</span>`;
async function load(){const root=document.getElementById('app');try{const d=await api('/admin/guilds');root.innerHTML=`<section><span class="eyebrow">Workspace</span><h1>Server của bạn</h1><p class="muted">Tất cả server Discord trong tài khoản của bạn đều được hiển thị. Click vào một server để mở profile; server chưa có bot sẽ ghi rõ trạng thái tham gia xếp hạng.</p></section><div class="grid kpis"><div class="card"><span class="kpi-label">Tổng server</span><strong class="kpi-value">${d.guilds.length}</strong><span class="muted">trong tài khoản Discord</span></div><div class="card"><span class="kpi-label">Đã tham gia xếp hạng</span><strong class="kpi-value" style="color:var(--cyan)">${d.guilds.filter(g=>g.bot_present).length}</strong><span class="muted">bot đang hiện diện</span></div><div class="card"><span class="kpi-label">Chưa tham gia</span><strong class="kpi-value" style="color:var(--orange)">${d.guilds.filter(g=>!g.bot_present).length}</strong><span class="muted">có thể thêm bot nếu có quyền</span></div></div><div class="section-head"><div><h2>Danh sách server</h2><span class="muted">Tự động làm mới mỗi 15 giây</span></div></div><div class="server-list">${d.guilds.map(g=>`<div class="server"><a href="/server.html?id=${g.id}">${icon(g)}</a><div class="server-main"><a href="/server.html?id=${g.id}"><b>${esc(g.name)}</b></a><span class="server-meta">${g.bot_present?'Đã tham gia xếp hạng':'Chưa tham gia xếp hạng'}${g.last_heartbeat?' · heartbeat '+new Date(g.last_heartbeat).toLocaleTimeString('vi-VN'):''}</span></div>${g.bot_present?status('Đã tham gia',true):g.can_manage&&g.invite?`<a class="btn primary" href="${esc(g.invite)}">+ Thêm bot</a>`:status('Không có quyền thêm')}</div>`).join('')||'<div class="card muted">Discord không trả về server nào.</div>'}</div>`}catch(e){root.innerHTML=e.status===401?'<div class="card"><h1>Đăng nhập để mở dashboard</h1><p class="muted">Dashboard cần quyền đọc danh sách server Discord của bạn.</p><a class="btn primary" href="/auth/login">Đăng nhập Discord</a></div>':'<div class="card notice">Không thể tải dashboard.</div>'}}load();setInterval(load,15000);
</script></body></html>
